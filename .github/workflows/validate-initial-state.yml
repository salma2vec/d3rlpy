name: Compare native evaluator validation
on:
  push:
    branches: [codex/validate-evaluator-comparison]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            revision: base
            gl: egl
          - python: '3.10'
            revision: fixed
            gl: ''
          - python: '3.11'
            revision: fixed
            gl: ''
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_PERFORMANCE: 'FALSE'
      KMP_DUPLICATE_LIB_OK: 'True'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported CPU runtime and native development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . -r dev.requirements.txt
          mkdir -p reports test_data
          pip freeze > reports/runtime.txt
      - name: Run public-API reproductions on pinned base
        if: matrix.revision == 'base'
        shell: bash
        run: |
          git restore --source=38c34b6f99fde82875e2ad81d1ba1f7a7da34137 -- d3rlpy tests
          python reproduce_followups.py > reports/followups.log 2>&1
          cat reports/followups.log
          python reproduce_initial_values.py | tee reports/initial-values.log
      - name: Native full unit suite
        if: always()
        shell: bash
        run: |
          if [ '${{ matrix.gl }}' = 'egl' ]; then export MUJOCO_GL=egl; fi
          set +e
          ./scripts/test > reports/full-suite.log 2>&1
          result=$?
          cat reports/full-suite.log
          echo "$result" > reports/full-suite.exit
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-${{ matrix.revision }}-${{ matrix.python }}
          path: reports
