name: Validate initial-state evaluation
on:
  push:
    branches: [codex/validate-initial-state-lint]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_PERFORMANCE: 'FALSE'
      KMP_DUPLICATE_LIB_OK: 'True'
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported CPU runtime and native development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . -r dev.requirements.txt
          mkdir -p reports test_data
          pip freeze > reports/runtime.txt
      - name: Native static checks on base and fix
        if: always()
        shell: bash
        run: |
          git fetch origin 03985d3f6d7a83a560e6f13efa799e33ab2c136f --depth=1
          git worktree add --detach /tmp/d3rlpy-lint-base 38c34b6f99fde82875e2ad81d1ba1f7a7da34137
          git worktree add --detach /tmp/d3rlpy-lint-fixed 03985d3f6d7a83a560e6f13efa799e33ab2c136f
          set +e
          (cd /tmp/d3rlpy-lint-base && CI=1 ./scripts/lint) > reports/lint-before.log 2>&1
          echo "$?" > reports/lint-before.exit
          (cd /tmp/d3rlpy-lint-fixed && CI=1 ./scripts/lint) > reports/lint-after.log 2>&1
          echo "$?" > reports/lint-after.exit
          git -C /tmp/d3rlpy-lint-base restore .
          git -C /tmp/d3rlpy-lint-fixed restore .
          (cd /tmp/d3rlpy-lint-base && mypy d3rlpy reproductions tests examples) > reports/mypy-before.log 2>&1
          echo "$?" > reports/mypy-before.exit
          (cd /tmp/d3rlpy-lint-fixed && mypy d3rlpy reproductions tests examples) > reports/mypy-after.log 2>&1
          echo "$?" > reports/mypy-after.exit
          cat reports/lint-after.log
          cat reports/mypy-after.log
          exit 0
      - name: Check changed-file formatting and lint
        if: always()
        run: |
          black --check -l 80 d3rlpy/metrics/evaluators.py tests/metrics/test_evaluators.py
          ruff check d3rlpy/metrics/evaluators.py tests/metrics/test_evaluators.py
          docformatter --check --diff --black --wrap-summaries 80 --wrap-descriptions 80 d3rlpy/metrics/evaluators.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python }}
          path: reports
