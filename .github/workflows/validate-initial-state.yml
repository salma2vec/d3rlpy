name: Validate initial-state evaluation
on:
  push:
    branches: [codex/validate-initial-state]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TEST_PERFORMANCE: 'FALSE'
      KMP_DUPLICATE_LIB_OK: 'True'
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install supported CPU runtime and native development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . -r dev.requirements.txt
          mkdir -p reports test_data
          pip freeze > reports/runtime.txt
      - name: Fail-before evaluator regressions
        shell: bash
        run: |
          cp d3rlpy/metrics/evaluators.py reports/fixed_evaluators.py
          git show 38c34b6f99fde82875e2ad81d1ba1f7a7da34137:d3rlpy/metrics/evaluators.py > d3rlpy/metrics/evaluators.py
          set +e
          pytest tests/metrics/test_evaluators.py -k initial_state -q --junitxml=reports/before.xml > reports/before.log 2>&1
          result=$?
          set -e
          cp reports/fixed_evaluators.py d3rlpy/metrics/evaluators.py
          cat reports/before.log
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('reports/before.xml').getroot().find('testsuite')
          assert suite.attrib['tests'] == '29', suite.attrib
          assert suite.attrib['failures'] == '19', suite.attrib
          assert suite.attrib['errors'] == '0', suite.attrib
          PY
      - name: Pass-after evaluator regressions
        run: pytest tests/metrics/test_evaluators.py -k initial_state -q --junitxml=reports/after.xml
      - name: Native full unit suite
        shell: bash
        run: |
          set +e
          ./scripts/test > reports/full-suite.log 2>&1
          result=$?
          cat reports/full-suite.log
          echo "$result" > reports/full-suite.exit
          exit "$result"
      - name: Native static checks on base and fix
        if: always()
        shell: bash
        run: |
          git worktree add --detach /tmp/d3rlpy-lint-base 38c34b6f99fde82875e2ad81d1ba1f7a7da34137
          git worktree add --detach /tmp/d3rlpy-lint-fixed 1ee4e7a4ed6ac590c81d7972a3edb9d501dd4cf7
          set +e
          (cd /tmp/d3rlpy-lint-base && CI=1 ./scripts/lint) > reports/lint-before.log 2>&1
          echo "$?" > reports/lint-before.exit
          (cd /tmp/d3rlpy-lint-fixed && CI=1 ./scripts/lint) > reports/lint-after.log 2>&1
          echo "$?" > reports/lint-after.exit
          cat reports/lint-after.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python }}
          path: reports
